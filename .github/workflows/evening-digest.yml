name: 📰 Evening Digest

on:
  schedule:
    # 7 PM UTC (2 PM EST / 11 AM PST)
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  fetch-and-summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and summarize articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python -c "
          import asyncio
          from services.news_fetcher import NewsAggregator
          from services.summarizer import ArticleSummarizer
          from config import get_settings

          settings = get_settings()
          news_aggregator = NewsAggregator(settings)
          summarizer = ArticleSummarizer(settings.openai_api_key)

          # Fetch articles from last day
          articles = asyncio.run(news_aggregator.fetch_all(days_back=1))
          print(f'Fetched {len(articles)} articles')

          # Summarize
          if articles:
              interests = ['business', 'education', 'ai', 'upskilling']
              summarized = summarizer.batch_summarize(
                  [{
                      'title': a.title,
                      'description': a.description,
                      'content': a.content,
                      'url': a.url,
                      'source': a.source,
                      'published_at': a.published_at.isoformat() if hasattr(a.published_at, 'isoformat') else str(a.published_at),
                      'category': a.category,
                      'image_url': a.image_url
                  } for a in articles],
                  interests
              )
              print(f'Summarized {len(summarized)} articles')
              print('✅ Evening digest generated successfully')
          "

      - name: Send digest email (placeholder)
        run: |
          echo '📧 TODO: Send evening digest email to users'
          echo 'Integration with email service (SendGrid, AWS SES) needed'

  notify-failure:
    runs-on: ubuntu-latest
    needs: fetch-and-summarize
    if: failure()

    steps:
      - name: Notify failure
        run: |
          echo "❌ Evening digest job failed"
          echo "TODO: Send failure notification to admin"
